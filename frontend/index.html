<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#163a70" />
    <meta name="description" content="Zwrotnica – sprawdź, ile należy Ci się za opóźniony pociąg, i wyślij gotową reklamację." />
    <title>Zwrotnica – odszkodowanie za opóźniony pociąg</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the color scheme before first paint (no flash): stored choice, else the OS preference.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('refund-pilot-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = 'light'
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141415')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
